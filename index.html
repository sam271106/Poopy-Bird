<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport"
        content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
    <title>Poop Patrol — IIT Delhi</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --cream: #fffef9;
            --sage: #f1f6ec;
            --text: #1f2d38;
            --muted: #647686;
            --line: #e1eadb;
            --accent: #ff5b36;
            --accent-shadow: #cc3412;
            --green: #58cc02;
            --green-shadow: #3f9900;
            --yellow: #ffc800;
            --yellow-shadow: #cf9c00;
            --blue: #1cb0f6;
            --blue-shadow: #1280b5;
            --danger: #e84118;
            --danger-shadow: #b32807;
        }

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent
        }

        html,
        body {
            height: 100%;
            margin: 0;
            overflow: hidden;
            background: #8fd276;
            font-family: 'Fredoka', system-ui, -apple-system, sans-serif;
            color: var(--text);
            user-select: none;
            -webkit-user-select: none;
            touch-action: none;
        }

        canvas#c {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            touch-action: none;
        }

        /* =========================================================
   HOME SCREEN (CALM, AIRY, ZERO-LEAK VISIBILITY)
   ========================================================= */
        #home-screen {
            position: fixed;
            inset: 0;
            z-index: 35;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: calc(env(safe-area-inset-top, 0px) + 16px) 18px calc(env(safe-area-inset-bottom, 0px) + 20px);
            pointer-events: none;
            opacity: 1;
            visibility: visible;
            transition: opacity .2s ease, transform .2s ease, visibility 0s;
        }

        #home-screen>* {
            pointer-events: auto
        }

        #home-screen.hidden {
            opacity: 0;
            transform: scale(0.97);
            visibility: hidden;
            pointer-events: none !important;
            transition: opacity .2s ease, transform .2s ease, visibility 0s linear .2s;
        }

        #home-screen.hidden * {
            pointer-events: none !important;
        }

        .home-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            max-width: 440px;
            width: 100%;
            margin: 0 auto;
        }

        .home-pill {
            background: rgba(255, 254, 249, 0.94);
            backdrop-filter: blur(8px);
            border: 2px solid #fff;
            border-radius: 99px;
            padding: 7px 14px;
            font-size: 13px;
            font-weight: 700;
            box-shadow: 0 4px 0 rgba(0, 0, 0, 0.08);
            cursor: pointer;
        }

        .circle-btn {
            width: 42px;
            height: 42px;
            border-radius: 50%;
            background: rgba(255, 254, 249, 0.95);
            border: 2px solid #fff;
            box-shadow: 0 4px 0 rgba(0, 0, 0, 0.08);
            font-size: 17px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .circle-btn:active {
            transform: translateY(3px);
            box-shadow: 0 1px 0 rgba(0, 0, 0, 0.08)
        }

        .home-center {
            max-width: 400px;
            width: 100%;
            margin: auto 0 14px;
            align-self: center;
            text-align: center;
            pointer-events: none;
        }

        .home-center .bird-showcase,
        .home-center .zone-progress-card {
            pointer-events: auto;
        }

        .brand-title {
            margin: 0;
            font-size: clamp(36px, 9.5vw, 50px);
            line-height: 0.95;
            font-weight: 800;
            color: #fff;
            text-shadow: 0 5px 0 #3a7519, 0 12px 24px rgba(0, 0, 0, 0.16);
        }

        .brand-sub {
            display: inline-block;
            margin: 7px 0 14px;
            background: rgba(31, 45, 56, 0.82);
            color: #ffe066;
            padding: 4px 13px;
            border-radius: 99px;
            font-size: 11px;
            font-weight: 700;
            letter-spacing: .06em;
            text-transform: uppercase;
        }

        .zone-progress-card {
            background: rgba(255, 254, 249, 0.95);
            backdrop-filter: blur(10px);
            border: 2.5px solid #fff;
            border-radius: 22px;
            padding: 11px 14px;
            box-shadow: 0 12px 26px rgba(20, 48, 14, 0.14), 0 5px 0 #d5e2ce;
            text-align: left;
            cursor: pointer;
            margin-bottom: 10px;
            transition: transform .12s;
        }

        .zone-progress-card:active {
            transform: scale(0.98)
        }

        .zone-card-top {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            margin-bottom: 8px;
        }

        .zone-stepper {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 4px;
            margin-bottom: 7px;
        }

        .step-node {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 11.5px;
            font-weight: 800;
            flex: none;
            border: 2px solid #fff;
            box-shadow: 0 2px 0 rgba(0, 0, 0, 0.1);
        }

        .step-node.done {
            background: var(--green);
            color: #fff;
        }

        .step-node.current {
            background: var(--blue);
            color: #fff;
            transform: scale(1.14);
            box-shadow: 0 0 0 3px rgba(28, 176, 246, 0.25), 0 3px 0 var(--blue-shadow);
        }

        .step-node.locked {
            background: #e4ebf0;
            color: #7d8d9b;
        }

        .step-line {
            flex: 1;
            height: 4px;
            border-radius: 99px;
            background: #e1eadb;
        }

        .step-line.done {
            background: var(--green);
        }

        .card-cta-pill {
            flex: none;
            font-size: 11px;
            font-weight: 800;
            padding: 4px 10px;
            border-radius: 99px;
            white-space: nowrap;
        }

        .card-cta-pill.blue {
            background: #e3f5ff;
            color: #0b6b9c;
        }

        .card-cta-pill.green {
            background: #e7fad9;
            color: #2f7300;
        }

        .bird-showcase {
            background: rgba(255, 254, 249, 0.95);
            backdrop-filter: blur(10px);
            border: 2.5px solid #fff;
            border-radius: 24px;
            padding: 11px 13px;
            box-shadow: 0 14px 30px rgba(20, 48, 14, 0.15), 0 5px 0 #d5e2ce;
            display: flex;
            align-items: center;
            gap: 11px;
            text-align: left;
            cursor: pointer;
            transition: transform .12s;
        }

        .bird-showcase:active {
            transform: scale(0.98)
        }

        .showcase-cv {
            width: 64px;
            height: 64px;
            border-radius: 18px;
            background: linear-gradient(145deg, #daf3ff, #e9fad8);
            border: 2px solid #fff;
            flex: none;
        }

        .unlock-badge {
            display: inline-block;
            font-size: 10.5px;
            font-weight: 800;
            color: #8a5a00;
            background: #fff4cc;
            padding: 2px 8px;
            border-radius: 99px;
            margin-bottom: 3px;
        }

        .perk-chip {
            display: inline-block;
            background: #eefbe5;
            color: #2f7300;
            border-radius: 99px;
            padding: 2px 8px;
            font-size: 11px;
            font-weight: 700;
            margin-top: 3px;
        }

        .home-bottom {
            max-width: 400px;
            width: 100%;
            margin: 0 auto;
        }

        .play-cta {
            width: 100%;
            border: 0;
            border-radius: 24px;
            padding: 16px 20px;
            background: linear-gradient(180deg, #6be012, #51bd00);
            color: #fff;
            font-family: inherit;
            font-size: 23px;
            font-weight: 800;
            letter-spacing: .02em;
            box-shadow: 0 8px 0 var(--green-shadow), 0 16px 32px rgba(63, 153, 0, 0.36);
            cursor: pointer;
            margin-bottom: 12px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 4px;
            transition: transform .08s, box-shadow .08s;
        }

        .play-cta small {
            background: rgba(0, 0, 0, 0.16);
            padding: 3px 11px;
            border-radius: 99px;
            font-size: 12px;
            font-weight: 700;
        }

        .play-cta:active {
            transform: translateY(5px);
            box-shadow: 0 2px 0 var(--green-shadow)
        }

        .home-dock {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
        }

        .dock-btn {
            background: rgba(255, 254, 249, 0.96);
            border: 2px solid #fff;
            border-radius: 19px;
            padding: 11px 12px;
            box-shadow: 0 5px 0 #d3ded0, 0 8px 16px rgba(0, 0, 0, 0.08);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 9px;
            text-align: left;
            font-family: inherit;
            font-size: 13.5px;
            font-weight: 800;
            color: var(--text);
            cursor: pointer;
        }

        .dock-btn span {
            font-size: 22px;
            line-height: 1;
        }

        .dock-btn small {
            display: block;
            font-size: 10.5px;
            font-weight: 700;
            color: var(--muted);
        }

        .dock-btn:active {
            transform: translateY(3px);
            box-shadow: 0 2px 0 #d3ded0
        }

        /* =========================================================
   IN-FLIGHT HUD (ULTRA-CLEAN, HIGH CONTRAST)
   ========================================================= */
        #hud {
            position: fixed;
            top: calc(env(safe-area-inset-top, 0px) + 12px);
            left: 12px;
            right: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 8px;
            pointer-events: none;
            z-index: 22;
            transition: opacity .2s;
        }

        #hud.hidden {
            opacity: 0;
            visibility: hidden;
            pointer-events: none !important
        }

        #hud.hidden * {
            pointer-events: none !important
        }

        .hud-pill {
            background: rgba(255, 254, 249, 0.95);
            border-radius: 99px;
            box-shadow: 0 4px 0 rgba(0, 0, 0, 0.1);
            display: flex;
            align-items: center;
            gap: 7px;
            padding: 6px 12px;
        }

        #goal-pill {
            flex: 1;
            max-width: 205px;
            padding: 6px 11px 6px 8px
        }

        #goal-pill.cleared #track-fill {
            background: linear-gradient(90deg, #ffc800, #ff9f1a)
        }

        #zone-tag {
            background: var(--yellow);
            color: #5c3d00;
            border-radius: 99px;
            padding: 2px 8px;
            font-size: 11.5px;
            font-weight: 800;
        }

        #goal-pill.cleared #zone-tag {
            background: var(--green);
            color: #fff
        }

        #track-bar {
            flex: 1;
            height: 9px;
            background: #e9eef2;
            border-radius: 99px;
            overflow: hidden
        }

        #track-fill {
            height: 100%;
            width: 0%;
            background: var(--green);
            border-radius: 99px;
            transition: width .25s cubic-bezier(.34, 1.56, .64, 1)
        }

        #score-meta {
            font-size: 12.5px;
            font-weight: 800;
            color: #3b4956;
            white-space: nowrap
        }

        #center-pills {
            display: flex;
            align-items: center;
            gap: 6px
        }

        #time-chip {
            font-weight: 800;
            font-size: 15px
        }

        #time-chip.urgent {
            background: var(--danger);
            color: #fff;
            box-shadow: 0 4px 0 var(--danger-shadow);
            animation: wobble .55s infinite
        }

        #danger-chip {
            display: none;
            background: var(--danger);
            color: #fff;
            font-size: 12px;
            font-weight: 800;
            padding: 5px 10px;
            border-radius: 99px;
            box-shadow: 0 4px 0 var(--danger-shadow);
            white-space: nowrap;
        }

        #danger-chip.visible {
            display: inline-flex;
            align-items: center;
            gap: 3px
        }

        @keyframes wobble {

            0%,
            100% {
                transform: scale(1)
            }

            50% {
                transform: scale(1.07)
            }
        }

        #btn-pause {
            pointer-events: auto;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: rgba(255, 254, 249, 0.95);
            border: 0;
            box-shadow: 0 4px 0 rgba(0, 0, 0, 0.1);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 14px;
            font-weight: 800;
            color: #556677;
            flex: none;
        }

        #btn-pause:active {
            transform: translateY(3px)
        }

        #combo-chip {
            position: fixed;
            top: calc(env(safe-area-inset-top, 0px) + 60px);
            left: 50%;
            transform: translateX(-50%) scale(0);
            background: var(--yellow);
            color: #5d3f00;
            box-shadow: 0 3px 0 var(--yellow-shadow);
            padding: 4px 14px;
            border-radius: 99px;
            font-size: 13px;
            font-weight: 800;
            z-index: 21;
            pointer-events: none;
            transition: transform .18s cubic-bezier(.34, 1.56, .64, 1);
        }

        #combo-chip.pop {
            transform: translateX(-50%) scale(1)
        }

        #banner {
            position: fixed;
            left: 50%;
            top: 31%;
            transform: translate(-50%, -50%) scale(0);
            text-align: center;
            pointer-events: none;
            font-weight: 800;
            font-size: clamp(24px, 6vw, 38px);
            color: #fff;
            text-shadow: 0 4px 0 rgba(0, 0, 0, 0.28);
            z-index: 28;
            width: 90%;
        }

        #banner small {
            display: inline-block;
            font-size: .42em;
            background: #fff;
            color: var(--text);
            box-shadow: 0 4px 0 #dde2e7;
            border-radius: 99px;
            padding: 5px 15px;
            margin-top: 8px;
            text-shadow: none;
        }

        #banner.show {
            animation: bannerPop 2s ease both
        }

        @keyframes bannerPop {
            0% {
                transform: translate(-50%, -50%) scale(0)
            }

            14% {
                transform: translate(-50%, -50%) scale(1.07)
            }

            24%,
            78% {
                transform: translate(-50%, -50%) scale(1)
            }

            100% {
                transform: translate(-50%, -66%) scale(.88);
                opacity: 0
            }
        }

        #danger-flash {
            position: fixed;
            inset: 0;
            background: rgba(232, 65, 24, 0.36);
            pointer-events: none;
            opacity: 0;
            transition: opacity .12s ease-out;
            z-index: 25;
        }

        /* =========================================================
   DYNAMIC LEFT-SIDE JOYSTICK & RIGHT-SIDE DROP CONTROLS
   ========================================================= */
        #left-touch-zone {
            position: fixed;
            left: 0;
            top: 68px;
            bottom: 0;
            width: 56vw;
            z-index: 15;
            touch-action: none;
        }

        #left-touch-zone.hidden {
            display: none
        }

        #joystick-container {
            position: fixed;
            left: 24px;
            top: calc(100% - 134px);
            width: 108px;
            height: 108px;
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(6px);
            border-radius: 50%;
            box-shadow: 0 6px 0 rgba(0, 0, 0, 0.12), 0 10px 20px rgba(0, 0, 0, 0.1);
            pointer-events: none;
            z-index: 16;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0.55;
            transition: opacity .12s ease, transform .12s ease;
        }

        #joystick-container.active {
            opacity: 1;
            transform: scale(1.04)
        }

        #joystick-container.hidden {
            opacity: 0;
            visibility: hidden;
            pointer-events: none
        }

        #joystick-container::after {
            content: "";
            position: absolute;
            inset: 9px;
            border-radius: 50%;
            border: 2px dashed #b4c1ce;
        }

        #joystick-knob {
            width: 46px;
            height: 46px;
            border-radius: 50%;
            background: var(--accent);
            box-shadow: 0 5px 0 var(--accent-shadow);
            position: absolute;
            pointer-events: none;
        }

        #bottom-ui {
            position: fixed;
            bottom: calc(env(safe-area-inset-bottom, 0px) + 22px);
            right: 18px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            z-index: 20;
            touch-action: none;
            transition: opacity .2s;
        }

        #bottom-ui.hidden {
            opacity: 0;
            visibility: hidden;
            pointer-events: none !important
        }

        #bottom-ui.hidden * {
            pointer-events: none !important
        }

        #ammo-tray {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(6px);
            border-radius: 99px;
            padding: 5px 11px;
            display: flex;
            gap: 5px;
            box-shadow: 0 3px 0 rgba(0, 0, 0, 0.08);
        }

        .ammo-pip {
            width: 9px;
            height: 12px;
            border-radius: 4px;
            background: #8c5738;
            border: 2px solid #fff;
            transition: transform .15s, opacity .15s
        }

        .ammo-pip.empty {
            background: transparent;
            border-color: #b9c2cc;
            opacity: .4;
            transform: scale(.75)
        }

        #drop-btn {
            width: 90px;
            height: 90px;
            border-radius: 30px;
            border: 3px solid rgba(255, 255, 255, 0.55);
            background: linear-gradient(180deg, #6be012, #51bd00);
            box-shadow: 0 7px 0 var(--green-shadow), 0 12px 22px rgba(88, 204, 2, 0.36);
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: #fff;
            font-family: inherit;
            font-weight: 800;
            font-size: 14px;
            touch-action: none;
            transition: transform .06s, box-shadow .06s;
        }

        #drop-btn.active {
            transform: translateY(5px);
            box-shadow: 0 2px 0 var(--green-shadow)
        }

        #drop-btn.empty-ammo {
            background: linear-gradient(180deg, #aab7c4, #8795a3);
            box-shadow: 0 6px 0 #64717d
        }

        #drop-btn span {
            font-size: 25px;
            line-height: 1;
            margin-bottom: 2px
        }

        .micro-hint {
            position: fixed;
            background: rgba(31, 45, 56, 0.86);
            color: #fff;
            padding: 5px 12px;
            border-radius: 99px;
            font-size: 12px;
            font-weight: 700;
            pointer-events: none;
            z-index: 19;
            opacity: 0;
            transform: translateY(4px);
            transition: opacity .25s ease, transform .25s ease;
            white-space: nowrap;
        }

        .micro-hint.show {
            opacity: 1;
            transform: translateY(0)
        }

        #hint-steer {
            left: 22px;
            bottom: calc(env(safe-area-inset-bottom, 0px) + 144px)
        }

        #hint-drop {
            right: 18px;
            bottom: calc(env(safe-area-inset-bottom, 0px) + 152px)
        }

        /* =========================================================
   SHEETS & CARDS
   ========================================================= */
        #ov {
            position: fixed;
            inset: 0;
            background: rgba(19, 30, 22, 0.5);
            backdrop-filter: blur(8px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 50;
            padding: 12px;
        }
        #ov.map-ov {
            padding: 6px;
        }

        #ov.hide {
            display: none !important;
            pointer-events: none !important
        }

        .sheet {
            background: var(--cream);
            border: 2.5px solid #fff;
            border-radius: 30px;
            width: min(96vw, 450px);
            max-height: 90vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            box-shadow: 0 22px 52px rgba(0, 0, 0, 0.28), 0 7px 0 #d4ddd0;
            animation: sheetIn .2s cubic-bezier(.34, 1.35, .64, 1);
        }
        .sheet.map-sheet {
            width: min(98vw, 500px);
            height: 95vh;
            max-height: 95vh;
            border-radius: 26px;
        }

        @keyframes sheetIn {
            from {
                transform: translateY(18px) scale(.96);
                opacity: 0
            }

            to {
                transform: translateY(0) scale(1);
                opacity: 1
            }
        }

        .sheet-head {
            padding: 14px 16px 12px;
            background: #fff;
            border-bottom: 2px solid var(--line);
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            flex: none;
        }

        .sheet-head h1 {
            margin: 0;
            font-size: 19px;
            font-weight: 800;
            line-height: 1.15
        }

        .sheet-sub {
            font-size: 12px;
            color: var(--muted);
            font-weight: 600;
            margin-top: 2px
        }

        .head-actions {
            display: flex;
            align-items: center;
            gap: 6px;
            flex: none
        }

        .close-btn {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            border: 2px solid var(--line);
            background: #fff;
            color: var(--text);
            font-size: 16px;
            font-weight: 800;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 3px 0 #dce3d7;
        }

        .close-btn:active {
            transform: translateY(2px)
        }

        .pill-action-btn {
            border: 2px solid var(--line);
            background: #fff;
            border-radius: 99px;
            padding: 6px 11px;
            font-family: inherit;
            font-size: 12px;
            font-weight: 700;
            color: var(--blue);
            cursor: pointer;
            text-decoration: none;
            box-shadow: 0 3px 0 #dce3d7;
        }

        .pill-action-btn:active {
            transform: translateY(2px)
        }

        .sheet-body {
            flex: 1;
            overflow-y: auto;
            padding: 14px 16px 18px;
            text-align: left;
            touch-action: pan-y;
        }

        .duo-btn {
            display: block;
            width: 100%;
            border: 0;
            border-radius: 17px;
            font-family: inherit;
            font-weight: 800;

          try{

            if(json && json.ok){

                g.gain.setValueAtTime(0.001, t + start);

        function renderHomeBackdrop(dt) {

            g.addColorStop(0.56, "#9edc80");

            // Stylized IITD Main Building & clocktower silhouette on the horizon
            const hy = H * 0.56;
            ctx.fillStyle = "rgba(91,158,72,0.45)";
            ctx.fillRect(W * 0.5 - 72, hy - 34, 144, 34);
            ctx.fillRect(W * 0.5 - 14, hy - 62, 28, 30);
            ctx.beginPath(); ctx.arc(W * 0.5, hy - 62, 14, Math.PI, 0); ctx.fill();

            ctx.fillStyle = "#66b44f";

                ctx.beginPath(); ctx.arc(x, hy, 28, 0, Math.PI * 2); ctx.fill();

            deco.clouds.forEach(cl => {

                if (cl.x > W + 90) cl.x = -90;
                ctx.save(); ctx.translate(cl.x, cl.y); ctx.scale(cl.s, cl.s);
                ctx.fillStyle = "rgba(255,255,255,0.88)";
                ctx.beginPath();
                ctx.arc(0, 0, 18, 0, Math.PI * 2); ctx.arc(18, -6, 22, 0, Math.PI * 2); ctx.arc(38, 0, 16, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            });

            const t = T0 / 1000;
            homeBirdSpin = Math.max(0, homeBirdSpin - dt * 2.4);
            const bx = W * 0.5 + Math.sin(t * 0.8) * Math.min(115, W * 0.26);
            const by = H * 0.155 + Math.sin(t * 1.9) * 10;
            const face = Math.cos(t * 0.8) >= 0 ? 1 : -1;

            targetCtx.translate(x, y);

            targetCtx.scale(face * (1 + sq * 0.22) * scale, (1 - sq * 0.22) * scale);

            if (bird.id === "rorpar") {
                targetCtx.fillStyle = "#27ae60";
                targetCtx.beginPath(); targetCtx.moveTo(-14, 2); targetCtx.lineTo(-42, 6); targetCtx.lineTo(-14, -3); targetCtx.fill();
            } else if (bird.id === "compea") {
                targetCtx.fillStyle = "#20bf6b";
                targetCtx.beginPath(); targetCtx.moveTo(-12, 0); targetCtx.lineTo(-42, -11); targetCtx.lineTo(-44, 11); targetCtx.closePath(); targetCtx.fill();
                targetCtx.fillStyle = "#0984e3"; targetCtx.beginPath(); targetCtx.arc(-34, -4, 3.2, 0, Math.PI * 2); targetCtx.arc(-35, 4, 3.2, 0, Math.PI * 2); targetCtx.fill();
                targetCtx.fillStyle = "#f1c40f"; targetCtx.beginPath(); targetCtx.arc(-34, -4, 1.4, 0, Math.PI * 2); targetCtx.arc(-35, 4, 1.4, 0, Math.PI * 2); targetCtx.fill();
            } else if (bird.id === "blakit1") {
                targetCtx.fillStyle = "#3e2723";
                targetCtx.beginPath(); targetCtx.moveTo(-12, 0); targetCtx.lineTo(-34, -9); targetCtx.lineTo(-27, 0); targetCtx.lineTo(-34, 9); targetCtx.closePath(); targetCtx.fill();
            } else {
                targetCtx.fillStyle = bird.wing;
                targetCtx.beginPath(); targetCtx.moveTo(-14, -3); targetCtx.lineTo(-27, -6); targetCtx.lineTo(-27, 5); targetCtx.lineTo(-14, 4); targetCtx.fill();
            }

            targetCtx.fillStyle = bird.col; targetCtx.beginPath(); targetCtx.ellipse(0, 0, 18, 13.5, 0, 0, Math.PI * 2); targetCtx.fill();
            targetCtx.fillStyle = bird.bel; targetCtx.beginPath(); targetCtx.ellipse(2, 4, 12, 8, 0, 0, Math.PI * 2); targetCtx.fill();

            if (bird.id === "isbduc1") {
                targetCtx.fillStyle = "#00b894"; targetCtx.beginPath(); targetCtx.ellipse(-5, 2, 6, 3.2, -0.2, 0, Math.PI * 2); targetCtx.fill();
            }
            if (bird.id === "rocpig") {
                targetCtx.strokeStyle = "#2d3436"; targetCtx.lineWidth = 2;
                targetCtx.beginPath(); targetCtx.moveTo(-8, -3); targetCtx.lineTo(-4, 5); targetCtx.stroke();
            }

            targetCtx.save();
            targetCtx.translate(-4, -2); targetCtx.rotate(flap);
            targetCtx.fillStyle = bird.wing; targetCtx.beginPath(); targetCtx.ellipse(-5, 0, 13, 6.5, 0, 0, Math.PI * 2); targetCtx.fill();
            targetCtx.restore();

            targetCtx.fillStyle = bird.id === "rewlap1" ? "#2c3e50" : bird.col;
            targetCtx.beginPath(); targetCtx.arc(14, -8, 9.5, 0, Math.PI * 2); targetCtx.fill();

            if (bird.id === "rorpar") {
                targetCtx.strokeStyle = "#ff6b81"; targetCtx.lineWidth = 2.5;
                targetCtx.beginPath(); targetCtx.arc(10, -3, 7, 0.2, 1.7); targetCtx.stroke();
            } else if (bird.id === "compea") {
                targetCtx.strokeStyle = "#0984e3"; targetCtx.lineWidth = 1.5;
                targetCtx.beginPath(); targetCtx.moveTo(13, -17); targetCtx.lineTo(10, -24); targetCtx.moveTo(15, -17); targetCtx.lineTo(15, -25); targetCtx.stroke();
                targetCtx.fillStyle = "#00cec9"; targetCtx.beginPath(); targetCtx.arc(10, -24, 1.7, 0, Math.PI * 2); targetCtx.arc(15, -25, 1.7, 0, Math.PI * 2); targetCtx.fill();
            } else if (bird.id === "rewlap1") {
                targetCtx.fillStyle = "#fff"; targetCtx.beginPath(); targetCtx.ellipse(11, -4, 4, 2.5, 0, 0, Math.PI * 2); targetCtx.fill();
                targetCtx.fillStyle = "#e84118"; targetCtx.beginPath(); targetCtx.arc(20, -10, 3.2, 0, Math.PI * 2); targetCtx.fill();
            }

            if (bird.id === "isbduc1") {
                targetCtx.fillStyle = "#1e272e"; targetCtx.beginPath(); targetCtx.roundRect(20, -10, 14, 5.5, 2.5); targetCtx.fill();
                targetCtx.fillStyle = "#ffc400"; targetCtx.beginPath(); targetCtx.roundRect(30, -10, 4.5, 5.5, 2); targetCtx.fill();
                targetCtx.fillStyle = "#ff4757"; targetCtx.beginPath(); targetCtx.arc(21.5, -9, 2, 0, Math.PI * 2); targetCtx.fill();
            } else if (bird.id === "blakit1" || bird.id === "rorpar") {
                targetCtx.fillStyle = bird.beak; targetCtx.beginPath(); targetCtx.moveTo(21, -11); targetCtx.quadraticCurveTo(31, -9, 29, -2); targetCtx.lineTo(21, -5); targetCtx.fill();
            } else {
                targetCtx.fillStyle = bird.beak; targetCtx.beginPath(); targetCtx.moveTo(21, -10); targetCtx.lineTo(30, -7); targetCtx.lineTo(21, -4); targetCtx.fill();
            }

            targetCtx.fillStyle = bird.id === "asikoe2" ? "#ff2e2e" : "#2f3542";
            targetCtx.beginPath(); targetCtx.arc(17, -10, 2.6, 0, Math.PI * 2); targetCtx.fill();
            targetCtx.fillStyle = "#fff"; targetCtx.beginPath(); targetCtx.arc(17.8, -10.8, 0.9, 0, Math.PI * 2); targetCtx.fill();
            targetCtx.restore();
        }

        function drawBirdIconCanvas(canvasEl, bird) {
            if (!canvasEl) return;
            const c = canvasEl.getContext("2d"), w = canvasEl.width, h = canvasEl.height;
            c.clearRect(0, 0, w, h);
            drawBirdSprite(c, bird, w * 0.48, h * 0.58, w / 78, 1, -0.06, 0.15, 0);
        }

        /* =========================================================
           PEDESTRIANS & CAMPUS GUARDS
           ========================================================= */
        const SHIRTS = ["#ff5252", "#ff793f", "#34ace0", "#33d9b2", "#ffb142", "#706fd3"];
        const HAIRS = ["#2c2c54", "#474787", "#84817a", "#d1ccc0"];
        const SKINS = ["#ffda79", "#f8c291", "#e77f67", "#fad390"];

        function countCurrentHunters() {
            let c = 0; for (const p of people) if (p.isHunter && p.hit <= 0) c++; return c;
        }

        function spawnPerson() {
            const pb = getPlayBounds();
            const currentHunters = countCurrentHunters();
            let isHunter = false;
            if (currentHunters < MAX_HUNTERS) {
                const hunterChance = Math.min(0.42, 0.16 + activeZone.num * 0.025 + S.dangerTier * 0.045);
                isHunter = Math.random() < hunterChance;
            }
            const speedBoost = S.dangerTier * 3;
            people.push({
                isHunter,
                x: Math.random() < 0.5 ? -30 : W + 30, y: R(pb.minY, pb.maxY),
                tx: R(pb.minX + 10, pb.maxX - 10), ty: R(pb.minY, pb.maxY),
                sp: isHunter ? R(18, 28) + speedBoost : R(22, 34) + S.dangerTier * 2,
                col: isHunter ? "#535c68" : pick(SHIRTS),
                hair: pick(HAIRS), skin: pick(SKINS),
                ph: R(0, 6), hit: 0, dead: false, bub: "", bubT: 0
            });
        }

        function updPeople(dt) {
            const pb = getPlayBounds();
            const targetCount = Math.min(6 + activeZone.num + S.dangerTier, 12);
            let living = 0; for (const p of people) if (p.hit <= 0) living++;
            if (living < targetCount && Math.random() < dt * 2.8) spawnPerson();

            for (const p of people) {
                p.ph += dt * p.sp * 0.1;
                if (p.bubT > 0) p.bubT -= dt;
                if (p.hit > 0) { p.hit -= dt; p.x += p.vx * dt; p.y += p.vy * dt; if (p.hit <= 0) p.dead = true; continue; }
                const dx = p.tx - p.x, dy = p.ty - p.y, d = Math.hypot(dx, dy);
                if (d < 12) { p.tx = R(pb.minX + 10, pb.maxX - 10); p.ty = R(pb.minY, pb.maxY); }
                else { p.x += dx / d * p.sp * dt; p.y += dy / d * p.sp * dt; }
            }
            people = people.filter(p => !p.dead);
        }

        function findReticleTarget(rx, ry) {
            const radius = 26 * activeBird.rad * UI_SCALE;
            let bestWalker = null, bestWalkerD = Infinity;
            let bestHunter = null, bestHunterD = Infinity;
            for (const p of people) {
                if (p.hit > 0) continue;
                const d = Math.hypot(p.x - rx, (p.y - 12) - ry);
                if (d < radius) {
                    if (p.isHunter) { if (d < bestHunterD) { bestHunter = p; bestHunterD = d; } }
                    else { if (d < bestWalkerD) { bestWalker = p; bestWalkerD = d; } }
                }
            }
            return bestWalker || bestHunter;
        }

        /* =========================================================
           POOP BALLISTICS, BANNER QUEUE & SCORING
           ========================================================= */
        let bannerQueue = [], bannerTimer = null;
        function banner(main, sub) {
            bannerQueue.push({ main, sub });
            if (!bannerTimer) flushBanner();
        }
        function flushBanner() {
            if (!bannerQueue.length) { bannerTimer = null; return; }
            const { main, sub } = bannerQueue.shift();
            const b = $("banner");
            b.innerHTML = `${main}<small>${sub}</small>`;
            b.classList.remove("show"); void b.offsetWidth; b.classList.add("show");
            bannerTimer = setTimeout(() => flushBanner(), 1950);
        }
        function clearBanners() {
            bannerQueue = [];
            if (bannerTimer) { clearTimeout(bannerTimer); bannerTimer = null; }
            $("banner").classList.remove("show");
        }

        function dropPoop() {
            if (S.state !== "play" || S.endingT > 0 || S.cd > 0) return;
            if (!S.hasDropped) {
                S.hasDropped = true;
                $("hint-drop").classList.remove("show");
            }
            if (S.ammo < 1) {
                S.cd = 0.2; snd(220, 0.08, "sawtooth", 0.1);
                addText(B.rx, B.ry - 38, "Reloading!", "#fff", 15);
                return;
            }
            S.ammo--; S.cd = 0.14; B.sq = 1; S.shots++;
            haptic(10);
            poops.push({ sx: B.x, sy: B.y, tx: B.rx, ty: B.ry, x: B.x, y: B.y, t: 0, dur: 0.32 });
            snd(720, 0.26, "sine", 0.09, -400);
            burst(B.x, B.y - 20, 4, ["#8c5738", "#a26945"], 60);
            renderAmmo();
        }

        function unlockBird(birdId) {
            const b = BIRDS.find(x => x.id === birdId);
            if (b && !b.unlocked) {
                b.unlocked = true;
                if (!PROGRESSION.unlockedBirds.includes(birdId)) PROGRESSION.unlockedBirds.push(birdId);
                saveAll();
                return b;
            }
            return null;
        }

        function checkZoneClear() {
            if (!S.zoneClearedThisRun && S.score >= activeZone.target) {
                S.zoneClearedThisRun = true;
                if (!PROGRESSION.zonesCleared.includes(activeZone.id)) PROGRESSION.zonesCleared.push(activeZone.id);
                if (!PROGRESSION.unlockedBgs.includes(activeZone.bgId)) PROGRESSION.unlockedBgs.push(activeZone.bgId);
                const nextIdx = ZONES.findIndex(z => z.id === activeZone.id) + 1;
                if (nextIdx < ZONES.length) {
                    const nz = ZONES[nextIdx];
                    if (!PROGRESSION.unlockedZones.includes(nz.id)) PROGRESSION.unlockedZones.push(nz.id);
                }
                const newBird = unlockBird(activeZone.unlockBird);
                S.time = Math.min(S.time + 12, 55);
                saveAll();
                const sub = newBird ? `Unlocked ${newBird.icon} ${newBird.n}! (+12s)` : `Next Zone Ready! (+12s)`;
                banner(`${activeZone.short.toUpperCase()} CLEARED!`, sub);
                setTimeout(() => playBirdCall(activeBird.id, false), 220);
            }
        }

        function checkDangerEscalation() {
            const newTier = getDangerTier(S.score);
            if (newTier > S.dangerTier) {
                S.dangerTier = newTier;
                const mult = getPenaltyMult(newTier).toFixed(1);
                const pen = getHunterPenaltySec(newTier);
                snd(330, 0.12, "sawtooth", 0.15, 220);
                banner(`⚠️ DANGER ×${mult}!`, `Guards now steal -${pen}s!`);
            }
        }

        function landPoop(po) {
            const hitPerson = findReticleTarget(po.tx, po.ty);

            if (hitPerson) {
                const p = hitPerson;
                if (p.isHunter) {
                    const pen = getHunterPenaltySec(S.dangerTier);
                    const mult = getPenaltyMult(S.dangerTier);
                    S.time = Math.max(0, S.time - pen);
                    S.combo = 0; hideCombo(); S.shake = 18;
                    haptic(45);
                    const flash = $("danger-flash");
                    flash.style.opacity = "1"; setTimeout(() => flash.style.opacity = "0", 260);
                    p.bub = "BUSTED!"; p.bubT = 1.4;
                    snd(120, 0.45, "sawtooth", 0.35, -70);
                    burst(po.tx, po.ty - 20, 24, ["#e84118", "#ffc400", "#2f3542"], 260);
                    addText(po.tx, po.ty - 44, `-${pen}s${mult > 1 ? ` (×${mult})` : ""}`, "#ff4757", 24);
                    p.hit = 1.0; p.vx = 0; p.vy = 0;
                    if (S.time <= 0) {
                        S.bustReason = true;
                        S.endingT = 0.55;
                    }
                    return;
                }

                S.combo++; S.comboT = 2.8;
                if (S.combo > STATS.bestCombo) STATS.bestCombo = S.combo;

                const mult = Math.min(1 + (S.combo - 1) * 0.5, 4) * (activeBird.ptMult || 1);
                const pts = Math.round(25 * mult);
                S.score += pts; S.hits++; S.hitsTot++;
                STATS.totalHits++; STATS.totalScore += pts;
                if (S.score > STATS.highScore) STATS.highScore = S.score;
                PROGRESSION.zoneBest[activeZone.id] = Math.max(PROGRESSION.zoneBest[activeZone.id] || 0, S.score);
                saveAll();
                saveRunSnapshot();

                S.time = Math.min(S.time + 1.5, 55);
                S.ammo = Math.min(S.max, S.ammo + 1);
                S.shake = 7; S.freeze = 0.025;

                p.hit = 1.3;
                const ang = R(0, Math.PI * 2);
                p.vx = Math.cos(ang) * 150; p.vy = Math.sin(ang) * 150;
                p.bub = pick(["WHO?!", "MY NOTES!", "SPLATTED!", "DIRECT HIT!"]);
                p.bubT = 1.2;

                decals.push({ x: po.tx, y: po.ty, r: R(16, 24) * activeBird.rad * UI_SCALE, a: 1 });
                burst(po.tx, po.ty, 16, ["#784421", "#8c5738", "#ffc400"], 200);
                addText(po.tx, po.ty - 40, `+${pts}`, "#fff", 22);
                addText(po.tx, po.ty - 64, "+1.5s", "#7bed9f", 18);

                playBirdCall(activeBird.id, true);
                popCombo(S.combo);
                checkZoneClear();
                checkDangerEscalation();
                if (STATS.highScore >= 500 || PROGRESSION.zonesCleared.length >= 5) {
                    const kite = unlockBird("blakit1");
                    if (kite) banner("APEX BIRDER!", "🦅 Black Kite Unlocked!");
                }
                renderAmmo();
                return;
            }

            S.combo = 0; hideCombo();
            decals.push({ x: po.tx, y: po.ty, r: R(8, 12) * UI_SCALE, a: 0.9 });
            burst(po.tx, po.ty, 6, ["#8c5738", "#63391d"], 80);
            snd(120, 0.1, "triangle", 0.1);
        }

        function popCombo(c) {
            const el = $("combo-chip");
            if (c >= 2) { el.textContent = `COMBO ×${c}`; el.classList.add("pop"); }
            else hideCombo();
        }
        function hideCombo() { $("combo-chip").classList.remove("pop"); }
        function burst(x, y, n, cols, sp) {
            for (let i = 0; i < n; i++) {
                const a = R(0, Math.PI * 2), s = R(0.4, 1) * sp;
                parts.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s - sp * 0.3, l: R(0.3, 0.7), c: pick(cols), r: R(2.5, 4.5) * UI_SCALE });
            }
        }
        function addText(x, y, s, c, size = 20) { texts.push({ x, y, s, c, size: size * UI_SCALE, l: 0.95 }); }

        function renderAmmo() {
            const box = $("ammo-tray"); box.innerHTML = "";
            for (let i = 0; i < S.max; i++) {
                const pip = document.createElement("div");
                pip.className = `ammo-pip ${i >= Math.floor(S.ammo) ? "empty" : ""}`;
                box.appendChild(pip);
            }
            $("drop-btn").classList.toggle("empty-ammo", S.ammo < 1);
        }

        function updateHUD() {
            $("sc").textContent = S.score;
            $("tg").textContent = activeZone.target;
            $("zone-tag").textContent = S.zoneClearedThisRun ? `Z${activeZone.num} ✓` : `Z${activeZone.num}`;
            $("goal-pill").classList.toggle("cleared", S.zoneClearedThisRun);
            $("tm").textContent = Math.ceil(S.time);
            $("track-fill").style.width = `${Math.min(100, (S.score / activeZone.target) * 100)}%`;

            const pen = getHunterPenaltySec(S.dangerTier);
            const dc = $("danger-chip");
            dc.textContent = `⚠️ -${pen}s`;
            dc.classList.toggle("visible", S.dangerTier >= 1);
            $("time-chip").classList.toggle("urgent", S.time <= 7 && S.state === "play");
        }

        function setFlightUI(visible) {
            $("hud").classList.toggle("hidden", !visible);
            $("left-touch-zone").classList.toggle("hidden", !visible);
            joyEl.classList.toggle("hidden", !visible);
            $("bottom-ui").classList.toggle("hidden", !visible);
            if (!visible) {
                $("hint-steer").classList.remove("show");
                $("hint-drop").classList.remove("show");
            }
        }

        /* =========================================================
           PHYSICS & RENDER
           ========================================================= */
        function update(dt) {
            if (S.endingT > 0) {
                S.endingT -= dt;
                parts.forEach(p => { p.l -= dt; p.vy += 450 * dt; p.x += p.vx * dt; p.y += p.vy * dt; });
                parts = parts.filter(p => p.l > 0);
                texts.forEach(t => { t.l -= dt; t.y -= 30 * dt; });
                texts = texts.filter(t => t.l > 0);
                S.shake = Math.max(0, S.shake - dt * 30);
                if (S.endingT <= 0) gameOver();
                return;
            }

            updPeople(dt);

            let ix = 0, iy = 0;
            if (keys.a || keys.arrowleft) ix--;
            if (keys.d || keys.arrowright) ix++;
            if (keys.w || keys.arrowup) iy--;
            if (keys.s || keys.arrowdown) iy++;
            if (ix !== 0 || iy !== 0) {
                const l = Math.hypot(ix, iy); joyState.dx = ix / l; joyState.dy = iy / l;
                if (!S.hasSteered) { S.hasSteered = true; $("hint-steer").classList.remove("show"); }
            } else if (!joyState.active) { joyState.dx = 0; joyState.dy = 0; }

            const pb = getPlayBounds();
            const maxSpeed = activeBird.maxReticleSpeed * UI_SCALE;
            B.rx += joyState.dx * maxSpeed * dt;
            B.ry += joyState.dy * maxSpeed * dt;
            B.rx = Math.max(pb.minX, Math.min(pb.maxX, B.rx));
            B.ry = Math.max(pb.minY - 8, Math.min(pb.maxY + 8, B.ry));

            const prevBx = B.x;
            B.x += (B.rx - B.x) * dt * 9;
            B.y += ((B.ry - 16 * UI_SCALE) - B.y) * dt * 9;
            const vx = B.x - prevBx;
            if (Math.abs(vx) > 0.3) B.face = vx > 0 ? 1 : -1;
            B.tilt += ((joyState.dx * 0.25) - B.tilt) * dt * 6;
            B.t += dt; B.sq = Math.max(0, B.sq - dt * 4); S.cd -= dt;

            for (const po of poops) {
                po.t += dt; const p = Math.min(1, po.t / po.dur);
                po.x = po.sx + (po.tx - po.sx) * p; po.y = po.sy + (po.ty - po.sy) * p;
            }
            const landed = poops.filter(p => p.t >= p.dur);
            poops = poops.filter(p => p.t < p.dur);
            landed.forEach(landPoop);

            if (S.ammo < S.max) {
                S.regen += dt;
                if (S.regen >= activeBird.rg) { S.regen = 0; S.ammo = Math.min(S.max, S.ammo + 1); renderAmmo(); }
            }

            parts.forEach(p => { p.l -= dt; p.vy += 450 * dt; p.x += p.vx * dt; p.y += p.vy * dt; });
            parts = parts.filter(p => p.l > 0);
            texts.forEach(t => { t.l -= dt; t.y -= 30 * dt; });
            texts = texts.filter(t => t.l > 0);
            decals.forEach(d => d.a -= dt * 0.05);
            decals = decals.filter(d => d.a > 0);

            S.shake = Math.max(0, S.shake - dt * 30);
            if (S.comboT > 0) { S.comboT -= dt; if (S.comboT <= 0) { S.combo = 0; hideCombo(); } }

            if (S.endingT <= 0) {
                S.time -= dt;
                if (S.time <= 0) { S.time = 0; gameOver(); }
            }
        }

        function render(dt) {
            if (S.state === "home") {
                renderHomeBackdrop(dt);
                return;
            }
            ctx.save();
            if (S.shake > 0) ctx.translate(R(-S.shake, S.shake), R(-S.shake, S.shake));

            renderZoneBackground(ctx, getCurrentBgId(), W, H, deco.trees);

            decals.forEach(d => {
                ctx.save(); ctx.globalAlpha = d.a * 0.7; ctx.fillStyle = "#744423";
                ctx.beginPath(); ctx.ellipse(d.x, d.y, d.r, d.r * 0.6, 0, 0, Math.PI * 2); ctx.fill(); ctx.restore();
            });

            if (S.state === "play" && S.endingT <= 0) drawSplatReticle();

            people.slice().sort((a, b) => a.y - b.y).forEach(drawPedestrian);
            poops.forEach(drawPoop);

            ctx.fillStyle = "rgba(0,0,0,0.14)";
            ctx.beginPath(); ctx.ellipse(B.x, B.y, 16 * UI_SCALE, 6 * UI_SCALE, 0, 0, Math.PI * 2); ctx.fill();
            drawBirdSprite(ctx, activeBird, B.x, B.y - 48 * UI_SCALE, UI_SCALE, B.face, B.tilt, Math.sin(B.t * 12) * 0.4, B.sq);

            parts.forEach(p => {
                ctx.save(); ctx.globalAlpha = p.l / 0.7; ctx.fillStyle = p.c;
                ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2); ctx.fill(); ctx.restore();
            });
            texts.forEach(t => {
                ctx.save(); ctx.globalAlpha = Math.min(1, t.l * 2);
                ctx.font = `800 ${t.size}px 'Fredoka',sans-serif`; ctx.textAlign = "center";
                ctx.fillStyle = "#22303c"; ctx.fillText(t.s, t.x + 1.5, t.y + 1.5);
                ctx.fillStyle = t.c; ctx.fillText(t.s, t.x, t.y); ctx.restore();
            });

            ctx.restore();
        }

        function drawPedestrian(p) {
            const scale = UI_SCALE;
            ctx.save(); ctx.translate(p.x, p.y);
            const bob = p.hit <= 0 ? Math.abs(Math.sin(p.ph * 2)) * 1.8 * scale : 0;

            if (p.isHunter) {
                const pulse = 1 + Math.sin(p.ph * 2.4) * 0.1;
                ctx.strokeStyle = "rgba(232,65,24,0.9)";
                ctx.lineWidth = 2.5 * scale;
                ctx.beginPath(); ctx.ellipse(0, 0, 18 * scale * pulse, 8.5 * scale * pulse, 0, 0, Math.PI * 2); ctx.stroke();
                ctx.fillStyle = "rgba(232,65,24,0.18)"; ctx.fill();

                ctx.translate(0, -bob);
                ctx.fillStyle = "#57606f"; ctx.beginPath(); ctx.roundRect(-9 * scale, -22 * scale, 18 * scale, 18 * scale, 5 * scale); ctx.fill();
                ctx.strokeStyle = "#2c3e50"; ctx.lineWidth = 3 * scale;
                ctx.beginPath(); ctx.moveTo(-6 * scale, -15 * scale); ctx.lineTo(-14 * scale, -34 * scale); ctx.stroke();
                ctx.fillStyle = p.skin; ctx.beginPath(); ctx.arc(0, -26 * scale, 7 * scale, 0, Math.PI * 2); ctx.fill();
                // Guard visor cap
                ctx.fillStyle = "#2f3542"; ctx.beginPath(); ctx.ellipse(0, -29 * scale, 12 * scale, 3.8 * scale, 0, 0, Math.PI * 2); ctx.fill();
                ctx.beginPath(); ctx.arc(0, -31.5 * scale, 6.5 * scale, Math.PI, Math.PI * 2); ctx.fill();
                ctx.fillStyle = "#e84118"; ctx.beginPath(); ctx.arc(0, -33 * scale, 2 * scale, 0, Math.PI * 2); ctx.fill();
            } else {
                ctx.fillStyle = "rgba(0,0,0,0.12)"; ctx.beginPath(); ctx.ellipse(0, 0, 12 * scale, 5 * scale, 0, 0, Math.PI * 2); ctx.fill();
                ctx.translate(0, -bob);
                ctx.fillStyle = p.col; ctx.beginPath(); ctx.roundRect(-8 * scale, -22 * scale, 16 * scale, 18 * scale, 6 * scale); ctx.fill();
                ctx.fillStyle = p.skin; ctx.beginPath(); ctx.arc(0, -26 * scale, 7 * scale, 0, Math.PI * 2); ctx.fill();
                ctx.fillStyle = p.hair; ctx.beginPath(); ctx.arc(0, -28 * scale, 7.5 * scale, Math.PI, Math.PI * 2); ctx.fill();
            }

            if (p.hit > 0) { ctx.fillStyle = "#784421"; ctx.beginPath(); ctx.arc(0, -32 * scale, 6 * scale, 0, Math.PI * 2); ctx.fill(); }
            if (p.bubT > 0) {
                ctx.font = `800 ${11 * scale}px 'Fredoka',sans-serif`;
                const w = ctx.measureText(p.bub).width + 14;
                ctx.fillStyle = "#fff"; ctx.beginPath(); ctx.roundRect(-w / 2, -53 * scale, w, 19 * scale, 8 * scale); ctx.fill();
                ctx.fillStyle = p.isHunter ? "#e84118" : "#22303c"; ctx.textAlign = "center"; ctx.fillText(p.bub, 0, -39.5 * scale);
            }
            ctx.restore();
        }

        function drawSplatReticle() {
            const rad = 26 * activeBird.rad * UI_SCALE;
            const target = findReticleTarget(B.rx, B.ry);
            ctx.save(); ctx.translate(B.rx, B.ry);

            if (target && target.isHunter) {
                ctx.strokeStyle = "rgba(232,65,24,0.95)";
                ctx.fillStyle = "rgba(232,65,24,0.18)";
                ctx.lineWidth = 3;
                ctx.beginPath(); ctx.arc(0, 0, rad, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
                ctx.font = `800 ${13 * UI_SCALE}px 'Fredoka',sans-serif`;
                ctx.fillStyle = "#e84118"; ctx.textAlign = "center";
                ctx.fillText("⚠️", 0, 4 * UI_SCALE);
            } else if (target && S.ammo >= 1) {
                const pulse = 1 + Math.sin(B.t * 14) * 0.06;
                ctx.strokeStyle = "#58cc02";
                ctx.fillStyle = "rgba(88,204,2,0.2)";
                ctx.lineWidth = 3;
                ctx.beginPath(); ctx.arc(0, 0, rad * pulse, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
                ctx.strokeStyle = "#fff"; ctx.lineWidth = 2;
                ctx.beginPath(); ctx.moveTo(-7, 0); ctx.lineTo(7, 0); ctx.moveTo(0, -7); ctx.lineTo(0, 7); ctx.stroke();
            } else {
                ctx.strokeStyle = S.ammo >= 1 ? "rgba(255,255,255,0.88)" : "rgba(140,150,165,0.5)";
                ctx.lineWidth = 2.5; ctx.setLineDash([5, 5]);
                ctx.beginPath(); ctx.arc(0, 0, rad, 0, Math.PI * 2); ctx.stroke();
                ctx.setLineDash([]);
                ctx.beginPath(); ctx.moveTo(-6, 0); ctx.lineTo(6, 0); ctx.moveTo(0, -6); ctx.lineTo(0, 6); ctx.stroke();
            }
            ctx.restore();
        }

        function drawPoop(po) {
            const p = po.t / po.dur, arc = Math.sin(p * Math.PI) * 28 * UI_SCALE, cy = po.y - (48 * UI_SCALE * (1 - p)) - arc;
            ctx.save();
            ctx.fillStyle = "rgba(0,0,0,0.16)";
            ctx.beginPath(); ctx.ellipse(po.tx, po.ty, (10 - p * 4) * UI_SCALE, (4.5 - p * 1.8) * UI_SCALE, 0, 0, Math.PI * 2); ctx.fill();
            ctx.restore();

            ctx.save(); ctx.translate(po.x, cy); ctx.rotate(po.t * 12);
            ctx.fillStyle = "#784421"; ctx.beginPath(); ctx.arc(0, 0, 6 * UI_SCALE, 0, Math.PI * 2); ctx.fill();
            ctx.fillStyle = "#915228"; ctx.beginPath(); ctx.arc(-1.5 * UI_SCALE, -1.5 * UI_SCALE, 2 * UI_SCALE, 0, Math.PI * 2); ctx.fill();
            ctx.restore();
        }

        /* =========================================================
           DYNAMIC LEFT-SIDE FLOATING JOYSTICK & MULTI-TOUCH DROP
           ========================================================= */
        function handleLeftTouchStart(e) {
            if (S.state !== "play" || S.endingT > 0) return;
            if (joyState.active && e.pointerId !== joyState.pid) return;
            e.preventDefault();
            ensureAC();

            if (!S.hasSteered) {
                S.hasSteered = true;
                $("hint-steer").classList.remove("show");
            }

            const halfSize = 54;
            const minX = halfSize + 8;
            const maxX = Math.max(minX + 10, W * 0.56 - halfSize);
            const minY = 72 + halfSize;
            const maxY = H - halfSize - 10;

            const cx = Math.max(minX, Math.min(maxX, e.clientX));
            const cy = Math.max(minY, Math.min(maxY, e.clientY));

            joyState.active = true;
            joyState.pid = e.pointerId;
            joyState.cx = cx;
            joyState.cy = cy;

            joyEl.style.left = (cx - halfSize) + "px";
            joyEl.style.top = (cy - halfSize) + "px";
            joyEl.classList.add("active");
            handleJoyMove(e);
        }

        function handleJoyMove(e) {
            if (!joyState.active || e.pointerId !== joyState.pid) return;
            const rdx = e.clientX - joyState.cx, rdy = e.clientY - joyState.cy, d = Math.hypot(rdx, rdy);
            if (d === 0) { joyState.dx = 0; joyState.dy = 0; knobEl.style.transform = "translate(0px,0px)"; return; }
            const cd = Math.min(d, joyState.maxRadius), nx = rdx / d, ny = rdy / d;
            knobEl.style.transform = `translate(${nx * cd}px,${ny * cd}px)`;
            const pwr = cd / joyState.maxRadius;
            joyState.dx = nx * pwr; joyState.dy = ny * pwr;
        }

        function handleJoyEnd(e) {
            if (joyState.active && e.pointerId === joyState.pid) {
                joyState.active = false; joyState.pid = null;
                joyState.dx = 0; joyState.dy = 0;
                joyEl.classList.remove("active");
                resetJoystickAnchor();
            }
        }

        leftZone.addEventListener("pointerdown", handleLeftTouchStart, { passive: false });
        window.addEventListener("pointermove", handleJoyMove, { passive: true });
        window.addEventListener("pointerup", handleJoyEnd);
        window.addEventListener("pointercancel", handleJoyEnd);

        const dropBtn = $("drop-btn");
        let dropPid = null;
        dropBtn.addEventListener("pointerdown", e => {
            e.preventDefault();

        dropBtn.addEventListener("click", e => e.preventDefault());
        window.addEventListener("pointerup", e => {
            if (e.pointerId === dropPid) { dropPid = null; dropBtn.classList.remove("active"); }
        });
        window.addEventListener("pointercancel", e => {
            if (e.pointerId === dropPid) { dropPid = null; dropBtn.classList.remove("active"); }

            const k = e.key.toLowerCase();
            if (S.state === "play" && (k === " " || k === "enter" || k.startsWith("arrow"))) {

            keys[k] = true;

            }

        /* =========================================================
           GAME FLOW: START, PAUSE, GAME OVER
           ========================================================= */
        function startGame(zoneId) {
            if (document.activeElement && typeof document.activeElement.blur === "function") {
                document.activeElement.blur();
            }
            ensureAC();
            if (zoneId) {
                const found = ZONES.find(z => z.id === zoneId);
                if (found && PROGRESSION.unlockedZones.includes(found.id)) {
                    activeZone = found; PROGRESSION.selectedZone = found.id; saveAll();
                }
            }
            clearRunSnapshot();
            S.state = "play"; S.score = 0; S.hits = 0; S.time = activeZone.timeStart;
            S.max = activeBird.maxAmmo; S.ammo = S.max;
            S.shots = 0; S.hitsTot = 0; S.zoneClearedThisRun = false; S.dangerTier = 0;
            S.endingT = 0; S.bustReason = false;
            S.combo = 0; S.comboT = 0;
            S.hasSteered = false; S.hasDropped = false;
            joyState.active = false; joyState.pid = null; joyState.dx = 0; joyState.dy = 0;
            dropPid = null; dropBtn.classList.remove("active");

            poops = []; people = []; decals = []; parts = []; texts = [];
            for (let i = 0; i < 4; i++) spawnPerson();

            B.rx = W / 2; B.ry = H / 2; B.x = W / 2; B.y = H / 2;

            $("home-screen").classList.add("hidden");
            $("ov").classList.add("hide");
            clearBanners();
            hideCombo();
            setFlightUI(true);
            resetJoystickAnchor();
            renderAmmo();
            updateHUD();
            banner(activeZone.short.toUpperCase(), `Hit walkers · Avoid ⚠️ Guards · Goal ${activeZone.target}`);
            playBirdCall(activeBird.id, true);

            if (STATS.totalRuns < 2) {
                $("hint-steer").classList.add("show");
                $("hint-drop").classList.add("show");
            }
        }

        function showPauseMenu() {
            S.state = "pause";
            joyState.active = false; joyState.pid = null; joyState.dx = 0; joyState.dy = 0;
            resetJoystickAnchor();
            const pen = getHunterPenaltySec(S.dangerTier);
            openSheet(`
    <div class="sheet-head">
      <div>
        <h1>Paused</h1>
        <div class="sheet-sub">${activeZone.short} · ${S.score}/${activeZone.target} pts</div>

      <button class="duo-btn alt" id="btn-p-home">EXIT TO HOME</button>
    </div>
  `);
            const resume = () => {
                if (document.activeElement && document.activeElement.blur) document.activeElement.blur();
                $("ov").classList.add("hide"); setFlightUI(true); S.state = "play";
            };
            $("btn-p-resume-x").onclick = resume;
            $("btn-resume").onclick = resume;
            $("btn-p-mute").onclick = () => { muted = !muted; showPauseMenu(); };
            $("btn-p-restart").onclick = () => startGame(activeZone.id);
            $("btn-p-home").onclick = () => { clearRunSnapshot(); closeToHome(); };
        }

        function gameOver() {
            S.state = "over";
            clearRunSnapshot();
            clearBanners();
            hideCombo();
            STATS.totalRuns++;
            saveAll();
            if (S.score > 0 || STATS.highScore > 0) syncScoreToSheet();
            snd(220, 0.35, "sawtooth", 0.18, -80);

            const accuracy = S.shots > 0 ? Math.round((S.hitsTot / S.shots) * 100) : 0;
            const cleared = S.score >= activeZone.target;
            const nextIdx = ZONES.findIndex(z => z.id === activeZone.id) + 1;
            const nextZone = nextIdx < ZONES.length ? ZONES[nextIdx] : null;
            const rewardBird = BIRDS.find(b => b.id === activeZone.unlockBird);
            const title = cleared ? "Zone Cleared! 🎉" : (S.bustReason ? "Caught by Guard! 🚨" : "Time’s Up!");

            openSheet(`
    <div class="sheet-head">

        </div>
      </div>

      ${cleared
                    ? `<div style="background:#e7fad9;border:2px solid #b9e89f;border-radius:16px;padding:10px 12px;font-size:12.5px;font-weight:700;margin-bottom:12px">

           </div>`
                    : `<div style="background:var(--sage);border-radius:16px;padding:10px 12px;font-size:12.5px;color:var(--muted);margin-bottom:12px">
             Reach <b>${activeZone.target} pts</b> (${Math.max(0, activeZone.target - S.score)} more) to unlock ${rewardBird.icon} ${rewardBird.n}.
           </div>`
                }

      ${cleared && nextZone
                    ? `<button class="duo-btn primary" id="btn-next-zone">NEXT: ${nextZone.short.toUpperCase()} ➔</button>`
                    : `<button class="duo-btn primary" id="btn-retry">FLY AGAIN</button>`
                }
      <div class="btn-row">
        <button class="duo-btn secondary" id="btn-o-map">🗺️ Map</button>
        <button class="duo-btn secondary" id="btn-o-ranks">🏆 Ranks</button>
      </div>
      <button class="duo-btn alt" id="btn-o-home">HOME</button>
    </div>
  `);

            $("btn-o-x").onclick = closeToHome;
            const nz = $("btn-next-zone"); if (nz) nz.onclick = () => startGame(nextZone.id);
            const rt = $("btn-retry"); if (rt) rt.onclick = () => startGame(activeZone.id);
            $("btn-o-map").onclick = () => openMapSheet();
            $("btn-o-ranks").onclick = () => openLeaderboardSheet();
            $("btn-o-home").onclick = closeToHome;

        /* =========================================================
           MAIN ENGINE LOOP
           ========================================================= */
        function loop(time) {
            if (!T0) T0 = time;
            const dt = Math.min(0.05, Math.max(0, (time - T0) / 1000));
            T0 = time;

            if (S.freeze > 0) S.freeze -= dt;
            else if (S.state === "play") update(dt);

            render(dt);
            if (S.state === "play") updateHUD();
            requestAnimationFrame(loop);
        }

        function handleAppInterruption(fromHideOrUnload = false) {
            saveAll();
            if (S.state === "play" && S.endingT <= 0) {
                joyState.active = false; joyState.pid = null; joyState.dx = 0; joyState.dy = 0;
                dropPid = null; dropBtn.classList.remove("active");
                saveRunSnapshot();
                if (STATS.highScore > 0 || S.score > 0) syncScoreToSheet(fromHideOrUnload);
                showPauseMenu();
            } else if (S.state === "pause") {
                saveRunSnapshot();
                if (fromHideOrUnload && (STATS.highScore > 0 || S.score > 0)) syncScoreToSheet(true);
            } else if (fromHideOrUnload && STATS.highScore > 0) {
                syncScoreToSheet(true);
            }
        }
        document.addEventListener("visibilitychange", () => {
            if (document.hidden) handleAppInterruption(true);
        });
        window.addEventListener("pagehide", () => handleAppInterruption(true));
        window.addEventListener("blur", () => handleAppInterruption(false));

        resize();
        if (!restoreRunSnapshot()) {
            showHome();
            renderAmmo();
        }
        requestAnimationFrame(loop);
    </script>
</body>

</html>
