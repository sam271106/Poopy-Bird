      </div>
    </div>
    <div class="sheet-body">
      ${fromLevelSelect ? `
        <button class="duo-btn primary" id="btn-atlas-play" style="margin-bottom:12px">▶ PLAY ${escHtml(activeZone.short.toUpperCase())}</button>
      ` : ""}
      <div class="bird-grid">
        ${BIRDS.map(b => {
                const isCur = b.id === activeBird.id;
                return `
            <div class="bird-tile ${isCur ? 'active' : ''} ${b.unlocked ? '' : 'locked'}" data-open-bird="${b.id}">
              <div class="bird-tile-sky">
                ${birdPhotoHtml(b, "tile-cv-" + b.id, 110, 82)}
                <button class="tile-sound-btn" data-hear="${b.id}" aria-label="Play Real Bird Call">🔊</button>
              </div>
              <div style="font-size:13.5px;font-weight:800;line-height:1.2">${b.n}</div>
              <div style="font-size:10.5px;font-weight:700;color:var(--blue);margin-top:3px">📍 ${b.homeZone}</div>
              <div style="font-size:11px;color:var(--muted);margin:2px 0 7px">${b.perk}</div>
              ${isCur
                        ? `<span class="pill-tag green">✓ Equipped</span>`
                        : b.unlocked
                            ? `<span class="pill-tag blue">Tap to Equip</span>`
                            : `<span class="pill-tag amber">🔒 ${b.unlockHint}</span>`
                    }
            </div>
          `;
            }).join("")}
      </div>
    </div>
  `);

            $("btn-x").onclick = closeToHome;
            if ($("btn-atlas-back")) $("btn-atlas-back").onclick = () => openMapSheet(activeZone.id);
            if ($("btn-atlas-play")) $("btn-atlas-play").onclick = () => startGame(activeZone.id);
            document.querySelectorAll("[data-hear]").forEach(btn => {
                btn.onclick = e => { e.stopPropagation(); playBirdCall(btn.dataset.hear, false, true); };
            });
            document.querySelectorAll("[data-open-bird]").forEach(el => {
                el.onclick = () => openBirdProfile(el.dataset.openBird, fromLevelSelect);
            });
        }

        function openBirdProfile(birdId, fromLevelSelect = false) {
            const b = BIRDS.find(x => x.id === birdId) || BIRDS[0];

            openSheet(`
    <div class="sheet-head">
      <button class="pill-action-btn" id="btn-prof-back" style="color:var(--text)">‹ Birds</button>
      <div class="head-actions">
        <a class="pill-action-btn" href="${b.ebirdUrl}" target="_blank" rel="noopener">eBird ↗</a>
        <button class="close-btn" id="btn-x" aria-label="Close">✕</button>
      </div>
    </div>
    <div class="sheet-body">
      <div class="profile-hero-big">
        ${birdPhotoHtml(b, "prof-cv", 320, 200)}
        <button class="profile-sound-pill" id="btn-prof-sound">🔊 Real Call</button>
      </div>

      <div style="margin-bottom:12px">
        <div style="font-size:22px;font-weight:800;line-height:1.15">${b.n}</div>
        <div style="display:flex;align-items:center;flex-wrap:wrap;gap:8px;margin-top:4px">
          <span style="font-size:13px;font-style:italic;color:var(--muted)">${b.sci}</span>
          <span class="pill-tag green">${b.perk}</span>
        </div>
      </div>

      ${b.unlocked
                    ? (activeBird.id === b.id
                        ? `<button class="duo-btn primary" id="btn-fly-bird" style="margin-bottom:12px">✓ EQUIPPED · FLY NOW</button>`
                        : `<div class="btn-row" style="margin-bottom:12px">
                 <button class="duo-btn secondary" id="btn-equip-bird">EQUIP</button>
                 <button class="duo-btn primary" id="btn-fly-bird">EQUIP &amp; FLY</button>
               </div>`)
                    : `<button class="duo-btn alt" style="margin-bottom:12px" disabled>🔒 Unlock: ${b.unlockHint}</button>`
                }

      <div style="font-size:13.5px;color:var(--text);line-height:1.5;margin-bottom:11px">${b.facts}</div>
      <div style="display:flex;flex-wrap:wrap;gap:6px">
        ${b.hotspots.map(h => `<span class="pill-tag blue">📍 ${h}</span>`).join("")}
      </div>
    </div>
  `);

            $("btn-x").onclick = closeToHome;
            $("btn-prof-back").onclick = () => openBirdAtlas(fromLevelSelect);
            $("btn-prof-sound").onclick = () => playBirdCall(b.id, false, true);
            const eq = $("btn-equip-bird");
            if (eq) eq.onclick = () => {
                activeBird = b; PROGRESSION.selectedBird = b.id; saveAll();
                playBirdCall(b.id, false, true);
                openBirdProfile(b.id, fromLevelSelect);
            };
            const fly = $("btn-fly-bird");
            if (fly) fly.onclick = () => {
                activeBird = b; PROGRESSION.selectedBird = b.id; saveAll();
                startGame(activeZone.id);
            };
        }

        /* =========================================================
           SHEET 3: PODIUM LEADERBOARD & PROMINENT CHANGE NAME
           ========================================================= */
        function openLeaderboardSheet(skipFetch = false, focusNameInput = false) {
            if (!skipFetch) fetchLiveLeaderboard();
            const lb = getCombinedLeaderboard();
            const hostels = getHostelStandings();
            const myRank = lb.findIndex(x => x.isMe) + 1;
            const syncStatus = !hasLiveApi() ? "Local" : (LIVE_LB.loading ? "Syncing…" : (LIVE_LB.offline ? "Offline" : "🟢 Live"));

            const podium = [lb[1], lb[0], lb[2]];
            const podiumClasses = ["second", "first", "third"];
            const medals = ["🥈", "👑", "🥉"];

            openSheet(`
    <div class="sheet-head">
      <div>
        <h1>IITD Leaderboard</h1>
        <div class="sheet-sub">Rank #${myRank} · ${getBirderRank(STATS.highScore)} · ${syncStatus}</div>
      </div>
      <div class="head-actions">
        <button class="pill-action-btn" id="btn-refresh-lb" title="Refresh">↻</button>
        <button class="pill-action-btn" id="btn-share-lb">📤 Share</button>
        <button class="close-btn" id="btn-x" aria-label="Close">✕</button>
      </div>
    </div>
    <div class="sheet-body">
      <div class="identity-hero-card">
        <div style="display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:${editingIdentity ? '10px' : '0'}">
          <div style="min-width:0">
            <div style="font-size:10.5px;font-weight:800;color:var(--blue-shadow);text-transform:uppercase;letter-spacing:.04em">Your Leaderboard Profile</div>
            <div style="font-size:15px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">
              ${escHtml(PROGRESSION.playerName)} · <span style="color:var(--blue)">${escHtml(PROGRESSION.playerHostel)}</span>
            </div>
          </div>
          <button class="pill-action-btn" id="btn-toggle-edit" style="background:${editingIdentity ? 'var(--green)' : 'var(--yellow)'};color:${editingIdentity ? '#fff' : '#5c3d00'};border-color:${editingIdentity ? 'var(--green)' : '#f0bc00'};font-size:12px;padding:6px 12px;flex:none">
            ${editingIdentity ? "✓ Save" : "✏️ Change Name"}
          </button>
        </div>

        ${editingIdentity ? `
          <div style="display:flex;gap:8px">
            <input class="duo-input" id="inp-player-name" value="${escHtml(PROGRESSION.playerName)}" maxlength="16" placeholder="Enter your name">
            <select class="duo-input" id="inp-player-hostel" style="max-width:138px">
              ${HOSTELS.map(h => `<option value="${h}" ${PROGRESSION.playerHostel === h ? 'selected' : ''}>${h}</option>`).join("")}
            </select>
          </div>
        ` : ""}
      </div>

      <div class="seg-bar">
        <button class="seg-btn ${rankSeg === 'campus' ? 'active' : ''}" id="seg-campus">Campus Top</button>
        <button class="seg-btn ${rankSeg === 'hostel' ? 'active' : ''}" id="seg-hostel">Hostel Cup</button>
      </div>

      ${LIVE_LB.loading
                    ? `<div class="sheet-sub" style="text-align:center;margin-bottom:8px">⏳ Loading live campus rankings…</div>`
                    : LIVE_LB.offline
                        ? `<div class="sheet-sub" style="text-align:center;margin-bottom:8px;color:var(--danger)">⚠️ Offline${location.protocol === "file:" ? " — open in Safari if using preview" : ""}</div>`
                        : ""
                }

      ${rankSeg === "campus" ? `
        <div class="podium-grid">
          ${podium.map((r, idx) => r ? `
            <div class="podium-card ${podiumClasses[idx]}">
              <div class="podium-medal">${medals[idx]}</div>
              <div class="podium-name">${escHtml(r.name)}${r.isMe ? ' ★' : ''}</div>
              <div style="font-size:10.5px;color:var(--muted)">${escHtml(r.hostel)}</div>
              <div class="podium-pts">${r.score}</div>
            </div>
          ` : `<div></div>`).join("")}
        </div>
        ${lb.slice(3).map((r, i) => `
          <div class="lb-row ${r.isMe ? 'me' : ''}">
            <div class="lb-rank">${i + 4}</div>
            <div style="flex:1;min-width:0">
              <div style="font-size:13.5px;font-weight:800">${escHtml(r.name)} ${r.isMe ? '(You)' : ''}</div>
              <div style="font-size:11px;color:var(--muted)">${escHtml(r.hostel)} · ${r.bird}</div>
            </div>
            <div style="font-weight:800;color:var(--green-shadow);font-size:14.5px">${r.score}</div>
          </div>
        `).join("")}
      ` : hostels.map((h, i) => `
        <div class="lb-row ${h.isMe ? 'me' : ''}">
          <div class="lb-rank">${i + 1}</div>
          <div style="flex:1;font-size:13.5px;font-weight:800">${escHtml(h.hostel)} ${h.isMe ? '(Yours)' : ''}</div>
          <div style="font-weight:800;color:var(--blue);font-size:14.5px">${h.pts} pts</div>
        </div>
      `).join("")}
    </div>
  `);

            $("btn-x").onclick = closeToHome;
            $("btn-refresh-lb").onclick = () => { snd(540, 0.06, "triangle", 0.07); fetchLiveLeaderboard(true); };
            const commitIdentity = (refreshAfter) => {
                const nameInp = $("inp-player-name");
                const hostelInp = $("inp-player-hostel");
                if (nameInp) PROGRESSION.playerName = nameInp.value.trim() || "IITD Flier";
                if (hostelInp) PROGRESSION.playerHostel = hostelInp.value;
                saveAll();
                const p = syncScoreToSheet();
                if (refreshAfter) p.then(() => fetchLiveLeaderboard(true));
            };
            $("btn-toggle-edit").onclick = () => {
                if (editingIdentity) commitIdentity(true);
                editingIdentity = !editingIdentity;
                openLeaderboardSheet(true, editingIdentity);
            };
            if (editingIdentity) {
                const inp = $("inp-player-name");
                if (focusNameInput && inp) {
                    setTimeout(() => { inp.focus(); inp.select(); }, 40);
                }
                inp.oninput = () => {
                    PROGRESSION.playerName = inp.value.trim() || "IITD Flier";
                    saveAll();
                };
                inp.onchange = () => commitIdentity(true);
                $("inp-player-hostel").onchange = () => { commitIdentity(true); openLeaderboardSheet(true); };
            }
            $("seg-campus").onclick = () => { rankSeg = "campus"; openLeaderboardSheet(true); };
            $("seg-hostel").onclick = () => { rankSeg = "hostel"; openLeaderboardSheet(true); };
            $("btn-share-lb").onclick = () => {
                const txt = `🕊️ Poop Patrol IITD (${PROGRESSION.playerHostel}): Scored ${STATS.highScore} pts as ${activeBird.n}! Unlocked ${PROGRESSION.unlockedBirds.length}/${BIRDS.length} birds (eBird L2747804).`;
                if (navigator.clipboard) navigator.clipboard.writeText(txt).catch(() => { });
                $("btn-share-lb").textContent = "✓ Copied";
                snd(660, 0.1, "triangle", 0.1);
            };
        }

        /* =========================================================
           GAME FLOW: START, PAUSE, CLEAN ALIGNED GAME OVER
           ========================================================= */
        function startGame(zoneId) {
            stopRealBirdAudio();
            if (document.activeElement && typeof document.activeElement.blur === "function") {
                document.activeElement.blur();
            }
            ensureAC();
            if (zoneId) {
                const found = ZONES.find(z => z.id === zoneId);
                if (found && PROGRESSION.unlockedZones.includes(found.id)) {
                    activeZone = found; PROGRESSION.selectedZone = found.id; saveAll();
                }
            }
            clearRunSnapshot();
            S.playSec = 0;
            S.state = "play"; S.score = 0; S.hits = 0; S.time = activeZone.timeStart;
            S.max = activeBird.maxAmmo; S.ammo = S.max;
            S.shots = 0; S.hitsTot = 0; S.zoneClearedThisRun = false; S.dangerTier = 0;
            S.endingT = 0; S.bustReason = false;
            S.combo = 0; S.comboT = 0;
            S.hasSteered = false; S.hasDropped = false;
            S.thumbGuideT = 4.2;
            joyState.active = false; joyState.pid = null; joyState.dx = 0; joyState.dy = 0;
            dropPid = null; dropBtn.classList.remove("active");

            poops = []; people = []; decals = []; parts = []; texts = [];
            for (let i = 0; i < 4; i++) spawnPerson();

            B.rx = W / 2; B.ry = H / 2; B.x = W / 2; B.y = H / 2;

            $("home-screen").classList.add("hidden");
            $("ov").classList.add("hide");
            clearBanners();
            hideCombo();
            setFlightUI(true);
            resetJoystickAnchor();
            renderAmmo();
            updateHUD();
            banner(activeZone.short.toUpperCase(), `Hit Walkers (+1.5s) · Avoid Guards (-6s) · Goal ${activeZone.target}`);
            playBirdCall(activeBird.id, true, false);

            $("two-thumb-guide").classList.add("show");
        }

        function showPauseMenu() {
            S.state = "pause";
            joyState.active = false; joyState.pid = null; joyState.dx = 0; joyState.dy = 0;
            resetJoystickAnchor();
            const pen = getHunterPenaltySec(S.dangerTier);
            openSheet(`
    <div class="sheet-head">
      <div>
        <h1>Paused</h1>
        <div class="sheet-sub">${activeZone.short} · ${S.score}/${activeZone.target} pts</div>
      </div>
      <div class="head-actions">
        <button class="pill-action-btn" id="btn-p-mute">${muted ? "🔇" : "🔊"}</button>
        <button class="close-btn" id="btn-p-resume-x" aria-label="Resume">✕</button>
      </div>
    </div>
    <div class="sheet-body">
      <div class="lb-row" style="justify-content:space-between;margin-bottom:12px">
        <span style="font-size:13.5px;font-weight:700">Time Left: <b>${Math.ceil(S.time)}s</b></span>
        <span class="pill-tag red">Guard Penalty: -${pen}s</span>
      </div>
      <button class="duo-btn primary" id="btn-resume">RESUME</button>
      <button class="duo-btn secondary" id="btn-p-restart">RESTART ZONE</button>
      <button class="duo-btn alt" id="btn-p-home" style="margin-bottom:0">EXIT TO HOME</button>
    </div>
  `);
            const resume = () => {
                if (document.activeElement && document.activeElement.blur) document.activeElement.blur();
                $("ov").classList.add("hide"); setFlightUI(true); S.state = "play";
            };
            $("btn-p-resume-x").onclick = resume;
            $("btn-resume").onclick = resume;
            $("btn-p-mute").onclick = () => { muted = !muted; showPauseMenu(); };
            $("btn-p-restart").onclick = () => startGame(activeZone.id);
            $("btn-p-home").onclick = () => { clearRunSnapshot(); closeToHome(); };
        }

        function gameOver() {
            S.state = "over";
            clearRunSnapshot();
            clearBanners();
            hideCombo();
            STATS.totalRuns++;
            STATS.totalPlaySec += Math.round(S.playSec);
            saveAll();
            if (S.score > 0 || STATS.highScore > 0) syncScoreToSheet(true);
            snd(220, 0.35, "triangle", 0.12, -80);

            const accuracy = S.shots > 0 ? Math.round((S.hitsTot / S.shots) * 100) : 0;
            const cleared = S.score >= activeZone.target;
            const outcome = cleared ? "cleared" : (S.bustReason ? "busted" : "timeout");
            logRunEvent(outcome, accuracy);
            const nextIdx = ZONES.findIndex(z => z.id === activeZone.id) + 1;
            const nextZone = nextIdx < ZONES.length ? ZONES[nextIdx] : null;
            const rewardBird = BIRDS.find(b => b.id === activeZone.unlockBird);
            const title = cleared ? "Zone Cleared! 🎉" : (S.bustReason ? "Caught by Guard! 🚨" : "Time’s Up!");
            const isDefaultName = !PROGRESSION.playerName || PROGRESSION.playerName === "IITD Flier";
            const ptsLeft = Math.max(0, activeZone.target - S.score);

            openSheet(`
    <div class="sheet-head">
      <div>
        <h1>${title}</h1>
        <div class="sheet-sub">${activeZone.short} · Peak Danger ×${getPenaltyMult(S.dangerTier).toFixed(1)}</div>
      </div>
      <button class="close-btn" id="btn-o-x" aria-label="Home">✕</button>
    </div>
    <div class="sheet-body">
      <div class="go-summary-card">
        <div class="go-score-row">
          <div>
            <div style="font-size:11px;font-weight:800;color:var(--muted);text-transform:uppercase">Run Score</div>
            <div style="font-size:34px;font-weight:800;color:var(--green-shadow);line-height:1">${S.score}</div>
          </div>
          <div style="text-align:right">
            ${cleared
                    ? `<span class="pill-tag green">🔓 ${escHtml(rewardBird.n)}</span>`
                    : `<span class="pill-tag amber">${ptsLeft} pts to ${escHtml(rewardBird.n)}</span>`
                }
          </div>
        </div>
        <div class="go-stat-grid">
          <div class="go-stat-box">
            <div class="go-stat-val">${STATS.highScore}</div>
            <div class="go-stat-lbl">Best</div>
          </div>
          <div class="go-stat-box">
            <div class="go-stat-val">${accuracy}%</div>
            <div class="go-stat-lbl">Accuracy</div>
          </div>
          <div class="go-stat-box">
            <div class="go-stat-val">${S.hits}</div>
            <div class="go-stat-lbl">Hits</div>
          </div>
        </div>
      </div>

      ${cleared && nextZone
                    ? `<button class="duo-btn primary" id="btn-next-zone">NEXT: ${nextZone.short.toUpperCase()} ➔</button>`
                    : `<button class="duo-btn primary" id="btn-retry">FLY AGAIN</button>`
                }
      <button class="duo-btn blue-cta" id="btn-o-ranks-hero">
        🏆 ${isDefaultName ? "SET NAME &amp; VIEW LEADERBOARD" : `LEADERBOARD · ${escHtml(PROGRESSION.playerName)}`}
      </button>
      <div class="btn-row">
        <button class="duo-btn secondary" id="btn-o-map">🗺️ Map</button>
        <button class="duo-btn alt" id="btn-o-home">🏠 Home</button>
      </div>
    </div>
  `);

            $("btn-o-x").onclick = closeToHome;
            const nz = $("btn-next-zone"); if (nz) nz.onclick = () => startGame(nextZone.id);
            const rt = $("btn-retry"); if (rt) rt.onclick = () => startGame(activeZone.id);
            $("btn-o-map").onclick = () => openMapSheet();
            $("btn-o-ranks-hero").onclick = () => {
                editingIdentity = isDefaultName;
                openLeaderboardSheet(false, isDefaultName);
            };
            $("btn-o-home").onclick = closeToHome;
        }

        $("btn-pause").onclick = () => { if (S.state === "play" && S.endingT <= 0) showPauseMenu(); };

        /* =========================================================
           MAIN ENGINE LOOP
           ========================================================= */
        function loop(time) {
            if (!T0) T0 = time;
            const dt = Math.min(0.05, Math.max(0, (time - T0) / 1000));
            T0 = time;

            if (S.freeze > 0) S.freeze -= dt;
            else if (S.state === "play") {
                S.playSec += dt;
                update(dt);
            }

            render(dt);
            if (S.state === "play") updateHUD();
            requestAnimationFrame(loop);
        }

        function handleAppInterruption(fromHideOrUnload = false) {
            saveAll();
            if (S.state === "play" && S.endingT <= 0) {
                joyState.active = false; joyState.pid = null; joyState.dx = 0; joyState.dy = 0;
                dropPid = null; dropBtn.classList.remove("active");
                saveRunSnapshot();
                if (STATS.highScore > 0 || S.score > 0) syncScoreToSheet(fromHideOrUnload);
                showPauseMenu();
            } else if (S.state === "pause") {
                saveRunSnapshot();
                if (fromHideOrUnload && (STATS.highScore > 0 || S.score > 0)) syncScoreToSheet(true);
            } else if (fromHideOrUnload && STATS.highScore > 0) {
                syncScoreToSheet(true);
            }
        }
        document.addEventListener("visibilitychange", () => {
            if (document.hidden) handleAppInterruption(true);
        });
        window.addEventListener("pagehide", () => handleAppInterruption(true));
        window.addEventListener("blur", () => handleAppInterruption(false));

        resize();
        if (!restoreRunSnapshot()) {
            showHome();
            renderAmmo();
        }
        requestAnimationFrame(loop);
    </script>
</body>

</html>
